frr version 10.2.1_git
frr defaults traditional
hostname r1
no ipv6 forwarding
!
interface eth1
!
interface eth2
!
interface lo
!
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 65001
 neighbor 10.0.13.2 remote-as 65002
 address-family ipv4 unicast
  network 1.1.1.1/32
  neighbor 10.0.12.2 next-hop-self
  neighbor 10.0.13.2 route-map PREFER-R3 in
 exit-address-family
!
route-map PREFER-R3 permit 10
 set local-preference 200
!
end
