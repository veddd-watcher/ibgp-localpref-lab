frr version 10.2.1_git
frr defaults traditional
hostname r2
no ipv6 forwarding
!
interface eth1
!
interface eth2
!
interface lo
!
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.23.2 remote-as 65002
 address-family ipv4 unicast
  network 2.2.2.2/32
 exit-address-family
end
