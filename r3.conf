frr version 10.2.1_git
frr defaults traditional
hostname r3
no ipv6 forwarding
!
interface eth1
!
interface eth2
!
interface lo
!
router bgp 65002
 no bgp ebgp-requires-policy
 neighbor 10.0.13.1 remote-as 65001
 neighbor 10.0.23.1 remote-as 65001
 address-family ipv4 unicast
  network 3.3.3.3/32
 exit-address-family
!
end
